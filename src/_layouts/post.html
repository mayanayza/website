---
layout: default
---

<div class="post-head">
  <div class="container">
    <div class="row">
      {% if page.featured_image %}
      <div class="col col-6 col-t-12">
        <div class="image-box">
          <img class="post-image lazy" data-src="{{ page.featured_image | relative_url }}" alt="{{ page.title }}">
        </div>
      </div>
      {% endif %}

      <div class="col col-6 col-t-12">
        <div class="post-head__box">
          <h2 class="post__title">{{ page.title }}</h2>

          <div class="post__bottom">
            <span class="post-tags">
                {% for tag in page.tags %}
                <a href="{{ site.baseurl }}/tags/?tag={{ tag | downcase | url_encode }}" class="post__tag tag">{{ tag }}</a>
                {% endfor %}
            </span>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- begin post -->
<div class="container">
  <article class="post">

    <div class="post__content background-blur animate-with-blur">
      {{ content }}
    </div>
  </article>
</div>
<!-- end post -->

{% include post-grid.html related_to="true" max_posts=3 %}
