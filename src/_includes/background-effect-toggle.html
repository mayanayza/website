<div class="toggle-container">
  <input type="checkbox" class="toggle__checkbox" id="background-toggle__checkbox">
  <label for="background-toggle__checkbox" class="toggle__checkbox-label" aria-label="Toggle light/dark mode">
    <i class="fas fa-face-smile toggle__icon toggle__icon--on"></i>
    <i class="fas fa-heart toggle__icon toggle__icon--off"></i>
    <span class="toggle__ball"></span>
  </label>
</div>
