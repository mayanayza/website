<div class="article col {% if forloop.index <= 2 and page.url == '/' %}col-6 col-t-12 grid__post animate article--big{% else %}col-4 col-d-6 col-t-12 grid__post animate{% endif %}">
  <div class="article__inner">

    {% if post.featured %}
    <span class="featured-post fa-regular fa-star"></span>
    {% endif %}

    <a class="article__image" href="{{ post.url | relative_url }}">
      {% if post.featured_image %}
      <img class="lazy" data-src="{{ post.featured_image | relative_url }}" alt="{{ post.title }}">
      {% endif %}
      {% if post.featured_code %}
      <div class="post-thumbnail code-background">
        <pre><code class="{{ post.code_language }}">{{ post.featured_code }}</code></pre>
      </div>
      {% endif %}
    </a>
    

    <div class="article__content">

      <h2 class="article__title">{{ post.title }}</h2>

      <p class="article__excerpt">{{ post.tagline }}</p>

      <div class="article__bottom">

        <div class="article__bottom-meta">
          {% if post.tags.size >= 1 %}
            <span class="article-tags">
              {% for tag in post.tags %}
                <a href="{{ site.baseurl }}/tags/?tag={{ tag | downcase | url_encode }}" class="article__tag">{{ tag }}</a>
              {% endfor %}
            </span>
          {% endif %}
        </div>
      </div>

    </div>

  </div>
</div>
