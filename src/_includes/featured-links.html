{% assign projects = site.posts | where: "feature_post", true %}

{% for project in projects %}
<div class="button button--primary button--links__page" onclick="window.open('{{ project.website }}', '_blank')">
  {% if project.featured_image %}
  <div class="button-image">
    <img src="{{ project.featured_image }}" alt="{{ project.name }}">
  </div>
  {% endif %}
  <span>{{ project.title }}</span>
</div>
{% endfor %}
