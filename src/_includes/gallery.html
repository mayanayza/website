<!-- _includes/image-gallery.html -->
{% assign images = include.images %}

<div class="gallery-container">
    <div class="main-image-container">
        <button class="nav-button prev">←</button>
        <img class="main-image" src="{{ images[0] | relative_url }}" alt="">
        <button class="nav-button next">→</button>
    </div>
    <div class="thumbnails-container">
        <div class="thumbnails-scroll">
            {% for image in images %}
            <div class="thumbnail-wrapper">
                <div class="thumbnail {% if forloop.first %}active{% endif %}">
                    <img src="{{ image | relative_url }}" alt="">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    .gallery-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }

    .main-image-container {
        position: relative;
        height: 400px;
        margin-bottom: 20px;
        background: #000000;
    }

    .main-image {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
    }

    .nav-button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 15px;
        cursor: pointer;
        z-index: 2;
        transition: background 0.3s;
    }

    .nav-button:hover {
        background: rgba(0, 0, 0, 0.8);
    }

    .prev {
        left: 0;
    }

    .next {
        right: 0;
    }

    .thumbnails-container {
        position: relative;
        overflow: hidden;
    }

    .thumbnails-scroll {
        display: flex;
        gap: 10px;
        transition: transform 0.3s ease;
    }

    .thumbnail {
        flex: 0 0 100px;
        height: 75px;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    
    .thumbnail-wrapper {
        pointer-events: auto;
        cursor: pointer;
    }

    .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .thumbnail.active {
        opacity: 1;
        border: 2px solid #007bff;
    }

    .thumbnails-container::before,
    .thumbnails-container::after {
        content: '';
        position: absolute;
        top: 0;
        width: 50px;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .thumbnails-container::before {
        left: 0;
        background: linear-gradient(to right, #000000, transparent);
    }

    .thumbnails-container::after {
        right: 0;
        background: linear-gradient(to left, #000000, transparent);
    }
</style>

<script>
    (function() {
        const mainImage = document.querySelector('.main-image');
        const thumbnails = document.querySelectorAll('.thumbnail');
        const thumbnailsScroll = document.querySelector('.thumbnails-scroll');
        const prevButton = document.querySelector('.prev');
        const nextButton = document.querySelector('.next');
        let currentIndex = 0;

        function updateImage(index) {
            currentIndex = index;
            
            mainImage.src = thumbnails[index].querySelector('img').src;
            
            thumbnails.forEach(thumb => thumb.classList.remove('active'));
            thumbnails[index].classList.add('active');
            
            const thumbnailWidth = thumbnails[0].offsetWidth + 10;
            const containerWidth = thumbnailsScroll.parentElement.offsetWidth;
            const maxScroll = thumbnailsScroll.scrollWidth - containerWidth;
            
            let scrollPosition = index * thumbnailWidth;
            scrollPosition = Math.max(0, Math.min(scrollPosition, maxScroll));
            thumbnailsScroll.style.transform = `translateX(-${scrollPosition}px)`;
        }

        const thumbnailWrappers = document.querySelectorAll('.thumbnail-wrapper');
        thumbnailWrappers.forEach((wrapper, index) => {
            wrapper.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                updateImage(index);
            });
        });

        prevButton.addEventListener('click', () => {
            const newIndex = (currentIndex - 1 + thumbnails.length) % thumbnails.length;
            updateImage(newIndex);
        });

        nextButton.addEventListener('click', () => {
            const newIndex = (currentIndex + 1) % thumbnails.length;
            updateImage(newIndex);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                const newIndex = (currentIndex - 1 + thumbnails.length) % thumbnails.length;
                updateImage(newIndex);
            } else if (e.key === 'ArrowRight') {
                const newIndex = (currentIndex + 1) % thumbnails.length;
                updateImage(newIndex);
            }
        });

        updateImage(0);
    })();
</script>
