<!-- _includes/image-gallery.html -->
{% assign images = include.images %}

{% if images.size > 0 %}
<div class="gallery-container">
    <div class="main-image-container">
        <div class="image-wrapper">
            <img class="main-image" src="{{ images[0] | relative_url }}" alt="" data-lightense="false">
            <button class="nav-button prev">←</button>
            <button class="nav-button next">→</button>
        </div>
    </div>
    <div class="thumbnails-container">
        <div class="thumbnails-scroll">
            {% for image in images %}
            <div class="thumbnail-wrapper">
                <div class="thumbnail {% if forloop.first %}active{% endif %}">
                    <img src="{{ image | relative_url }}" alt="" data-lightense="false">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}

<script>
    (function() {
        // Get the computed background color of the page
        const computedStyle = getComputedStyle(document.body);
        const bgColor = computedStyle.backgroundColor;
        
        // Convert RGB color to array of values
        const rgb = bgColor.match(/\d+/g);
        if (rgb) {
            document.documentElement.style.setProperty('--bg-color', rgb.join(', '));
        }

        const mainImage = document.querySelector('.main-image');
        const thumbnailWrappers = document.querySelectorAll('.thumbnail-wrapper');
        const thumbnailsScroll = document.querySelector('.thumbnails-scroll');
        const prevButton = document.querySelector('.prev');
        const nextButton = document.querySelector('.next');
        let currentIndex = 0;

        function updateImage(index) {
            currentIndex = index;
            
            const newImg = thumbnailWrappers[index].querySelector('img');
            mainImage.src = newImg.src;
            
            document.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('active'));
            thumbnailWrappers[index].querySelector('.thumbnail').classList.add('active');
            
            const thumbnailWidth = thumbnailWrappers[0].offsetWidth + 10;
            const containerWidth = thumbnailsScroll.parentElement.offsetWidth;
            const maxScroll = thumbnailsScroll.scrollWidth - containerWidth;
            
            let scrollPosition = index * thumbnailWidth;
            scrollPosition = Math.max(0, Math.min(scrollPosition, maxScroll));
            thumbnailsScroll.style.transform = `translateX(-${scrollPosition}px)`;
            
            // Update fade visibility based on scroll position
            const container = thumbnailsScroll.parentElement;
            container.classList.toggle('show-left-fade', scrollPosition > 0);
            container.classList.toggle('show-right-fade', scrollPosition < maxScroll);
        }

        thumbnailWrappers.forEach((wrapper, index) => {
            wrapper.addEventListener('click', () => {
                updateImage(index);
            });
        });

        prevButton.addEventListener('click', () => {
            const newIndex = (currentIndex - 1 + thumbnailWrappers.length) % thumbnailWrappers.length;
            updateImage(newIndex);
        });

        nextButton.addEventListener('click', () => {
            const newIndex = (currentIndex + 1) % thumbnailWrappers.length;
            updateImage(newIndex);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                const newIndex = (currentIndex - 1 + thumbnailWrappers.length) % thumbnailWrappers.length;
                updateImage(newIndex);
            } else if (e.key === 'ArrowRight') {
                const newIndex = (currentIndex + 1) % thumbnailWrappers.length;
                updateImage(newIndex);
            }
        });

        // Handle nav button fade
        const navButtons = document.querySelectorAll('.nav-button');
        setTimeout(() => {
            navButtons.forEach(button => button.classList.add('fade-out'));
        }, 2000);

        updateImage(0);
    })();
</script>
