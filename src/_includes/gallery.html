<!-- _includes/image-gallery.html -->
{% assign images = include.images %}

<div class="gallery-container">
    <div class="main-image-container">
        <div style="position: relative; width: 100%;">
            <button class="nav-button prev">←</button>
            <img class="main-image" src="{{ images[0] | relative_url }}" alt="" data-lightense="false">
            <button class="nav-button next">→</button>
        </div>
    </div>
    <div class="thumbnails-container">
        <div class="thumbnails-scroll">
            {% for image in images %}
            <div class="thumbnail-wrapper">
                <div class="thumbnail {% if forloop.first %}active{% endif %}">
                    <img src="{{ image | relative_url }}" alt="" data-lightense="false">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    .gallery-container {
        width: 100%;
        margin: 0 auto;
    }

    .main-image-container {
        position: relative;
        width: 100%;
        margin-bottom: 20px;
        background: transparent;
    }
    


    .main-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
    }

    .nav-button {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 15px;
        cursor: pointer;
        z-index: 2;
        transition: opacity 0.5s;
        opacity: 1;
        width: 50px;
    }

    .nav-button:hover {
        background: rgba(0, 0, 0, 0.8);
    }
    
    .main-image-container:not(:hover) .nav-button.fade-out {
        opacity: 0;
    }
    
    .prev {
        left: 0;
    }

    .next {
        right: 0;
    }

    .thumbnails-container {
        position: relative;
        overflow: hidden;
    }

    .thumbnails-scroll {
        display: flex;
        gap: 10px;
        transition: transform 0.3s ease;
    }

    .thumbnail {
        flex: 0 0 100px;
        height: 75px;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    
    .thumbnail-wrapper {
        pointer-events: auto;
        cursor: pointer;
    }

    .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        pointer-events: none;
    }

    .thumbnail.active {
        opacity: 1;
        border: 2px solid rgba(255,128,171,1);
    }

    .thumbnails-container::before,
    .thumbnails-container::after {
        content: '';
        position: absolute;
        top: 0;
        width: 50px;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .thumbnails-container::before {
        left: 0;
        background: linear-gradient(to right, rgba(var(--bg-color), 1), rgba(var(--bg-color), 0));
    }

    .thumbnails-container::after {
        right: 0;
        background: linear-gradient(to left, rgba(var(--bg-color), 1), rgba(var(--bg-color), 0));
    }

    .thumbnails-container.show-left-fade::before {
        opacity: 1;
    }

    .thumbnails-container.show-right-fade::after {
        opacity: 1;
    }
</style>

<script>
    (function() {
        // Get the computed background color of the page
        const computedStyle = getComputedStyle(document.body);
        const bgColor = computedStyle.backgroundColor;
        
        // Convert RGB color to array of values
        const rgb = bgColor.match(/\d+/g);
        if (rgb) {
            document.documentElement.style.setProperty('--bg-color', rgb.join(', '));
        }
        const mainImage = document.querySelector('.main-image');
        const thumbnails = document.querySelectorAll('.thumbnail');
        const thumbnailsScroll = document.querySelector('.thumbnails-scroll');
        const prevButton = document.querySelector('.prev');
        const nextButton = document.querySelector('.next');
        let currentIndex = 0;

        function updateImage(index) {
            currentIndex = index;
            
            mainImage.src = thumbnails[index].querySelector('img').src;
            
            thumbnails.forEach(thumb => thumb.classList.remove('active'));
            thumbnails[index].classList.add('active');
            
            const thumbnailWidth = thumbnails[0].offsetWidth + 10;
            const containerWidth = thumbnailsScroll.parentElement.offsetWidth;
            const maxScroll = thumbnailsScroll.scrollWidth - containerWidth;
            
            let scrollPosition = index * thumbnailWidth;
            scrollPosition = Math.max(0, Math.min(scrollPosition, maxScroll));
            thumbnailsScroll.style.transform = `translateX(-${scrollPosition}px)`;
            
            // Update fade visibility based on scroll position
            const container = thumbnailsScroll.parentElement;
            container.classList.toggle('show-left-fade', scrollPosition > 0);
            container.classList.toggle('show-right-fade', scrollPosition < maxScroll);
        }

        const thumbnailWrappers = document.querySelectorAll('.thumbnail-wrapper');
        thumbnailWrappers.forEach((wrapper, index) => {
            wrapper.addEventListener('click', () => {
                updateImage(index);
            });
        });

        prevButton.addEventListener('click', () => {
            const newIndex = (currentIndex - 1 + thumbnails.length) % thumbnails.length;
            updateImage(newIndex);
        });

        nextButton.addEventListener('click', () => {
            const newIndex = (currentIndex + 1) % thumbnails.length;
            updateImage(newIndex);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                const newIndex = (currentIndex - 1 + thumbnails.length) % thumbnails.length;
                updateImage(newIndex);
            } else if (e.key === 'ArrowRight') {
                const newIndex = (currentIndex + 1) % thumbnails.length;
                updateImage(newIndex);
            }
        });

        updateImage(0);
        
        // Handle nav button fade
        const navButtons = document.querySelectorAll('.nav-button');
        setTimeout(() => {
            navButtons.forEach(button => button.classList.add('fade-out'));
        }, 2000);
    })();
</script>
