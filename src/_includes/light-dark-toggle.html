<div class="toggle-container">
  <input type="checkbox" class="toggle__checkbox" id="light-dark-toggle__checkbox">
  <label for="light-dark-toggle__checkbox" class="toggle__checkbox-label" aria-label="Toggle light/dark mode">
    <i class="fas fa-moon toggle__icon toggle__icon--on"></i>
    <i class="fas fa-sun toggle__icon toggle__icon--off"></i>
    <span class="toggle__ball"></span>
  </label>
</div>
