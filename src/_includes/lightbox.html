<!-- _includes/lightbox.html -->
<div class="gallery-lightbox">
  <div class="lightbox-content">
    <div class="lightbox-image-container">
      <img src="" alt="">
    </div>
    <div class="lightbox-caption"></div>
    <div class="lightbox-counter"></div>
  </div>
  <div class="lightbox-close">
    <i class="fa-solid fa-xmark"></i>
  </div>
  <div class="lightbox-nav">
    <button class="prev-button" aria-label="Previous image">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button class="next-button" aria-label="Next image">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>
  
  <!-- Thumbnail navigation -->
  <div class="lightbox-thumbnails">
    <div class="lightbox-thumbnails-scroll"></div>
  </div>
</div>

<style>
  /* Additional styles for fixed lightbox container */
  .lightbox-image-container {
    width: 100%;
    height: calc(80vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000;
    border-radius: 4px;
    overflow: hidden;
  }
  
  .lightbox-counter {
    position: absolute;
    bottom: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    font-size: 14px;
    padding: 5px 10px;
    border-radius: 4px;
    z-index: 2;
  }
</style>

<script>
  (function() {
    // Initialize shared lightbox
    if (!window.galleryLightbox) {
      window.galleryLightbox = {
        initialized: false,
        init: function() {
          if (this.initialized) return;
          
          this.lightbox = document.querySelector('.gallery-lightbox');
          this.lightboxContainer = this.lightbox.querySelector('.lightbox-image-container');
          this.lightboxImg = this.lightbox.querySelector('.lightbox-image-container img');
          this.lightboxCaption = this.lightbox.querySelector('.lightbox-caption');
          this.lightboxCounter = this.lightbox.querySelector('.lightbox-counter');
          this.closeBtn = this.lightbox.querySelector('.lightbox-close');
          this.prevBtn = this.lightbox.querySelector('.prev-button');
          this.nextBtn = this.lightbox.querySelector('.next-button');
          this.thumbnailsScroll = this.lightbox.querySelector('.lightbox-thumbnails-scroll');
          
          this.currentIndex = 0;
          this.currentImages = [];
          this.currentTitle = '';
          
          // Add fade transition to image
          this.lightboxImg.style.transition = 'opacity 0.15s ease';
          
          // Set up event listeners
          this.closeBtn.addEventListener('click', this.close.bind(this));
          this.prevBtn.addEventListener('click', this.prev.bind(this));
          this.nextBtn.addEventListener('click', this.next.bind(this));
          
          // Close on background click
          this.lightbox.addEventListener('click', (e) => {
            if (e.target === this.lightbox) {
              this.close();
            }
          });
          
          // Keyboard navigation
          document.addEventListener('keydown', (e) => {
            if (!this.lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
              this.close();
            } else if (e.key === 'ArrowLeft') {
              this.prev();
            } else if (e.key === 'ArrowRight') {
              this.next();
            }
          });
          
          this.initialized = true;
        },
        
        open: function(images, index, title) {
          this.init();
          
          this.currentImages = images;
          this.currentIndex = index;
          this.currentTitle = title || '';
          
          // Preload images for smoother transitions
          this.preloadImages();
          
          // Generate thumbnails
          this.generateThumbnails();
          
          // Update image
          this.updateImage();
          
          // Show lightbox
          this.lightbox.classList.add('active');
          document.body.style.overflow = 'hidden';
        },
        
        close: function() {
          this.lightbox.classList.remove('active');
          document.body.style.overflow = '';
        },
        
        prev: function() {
          this.currentIndex = (this.currentIndex - 1 + this.currentImages.length) % this.currentImages.length;
          this.updateImage();
        },
        
        next: function() {
          this.currentIndex = (this.currentIndex + 1) % this.currentImages.length;
          this.updateImage();
        },
        
        updateImage: function() {
          // Use crossfade effect
          this.lightboxImg.style.opacity = 0;
          
          setTimeout(() => {
            const currentImg = this.currentImages[this.currentIndex];
            this.lightboxImg.src = currentImg;
            this.lightboxImg.style.opacity = 1;
            
            // Update caption and counter
            this.lightboxCaption.textContent = this.currentTitle;
            this.lightboxCounter.textContent = `${this.currentIndex + 1} / ${this.currentImages.length}`;
          }, 150);
          
          // Update active thumbnail
          const thumbnails = this.thumbnailsScroll.querySelectorAll('.lightbox-thumbnail');
          thumbnails.forEach((thumbnail, index) => {
            thumbnail.classList.toggle('active', index === this.currentIndex);
          });
          
          // Scroll thumbnail into view
          const activeThumbnail = this.thumbnailsScroll.querySelector('.lightbox-thumbnail.active');
          if (activeThumbnail) {
            activeThumbnail.scrollIntoView({
              behavior: 'smooth',
              block: 'nearest',
              inline: 'center'
            });
          }
        },
        
        generateThumbnails: function() {
          this.thumbnailsScroll.innerHTML = '';
          
          this.currentImages.forEach((src, index) => {
            const thumbnail = document.createElement('div');
            thumbnail.className = 'lightbox-thumbnail';
            if (index === this.currentIndex) {
              thumbnail.classList.add('active');
            }
            
            const img = document.createElement('img');
            img.src = src;
            
            thumbnail.appendChild(img);
            this.thumbnailsScroll.appendChild(thumbnail);
            
            thumbnail.addEventListener('click', () => {
              this.currentIndex = index;
              this.updateImage();
            });
          });
        },
        
        preloadImages: function() {
          // Preload neighboring images for smoother transitions
          const current = this.currentIndex;
          const total = this.currentImages.length;
          
          // Preload current, next and previous images
          [
            current,
            (current + 1) % total,
            (current - 1 + total) % total
          ].forEach(index => {
            const img = new Image();
            img.src = this.currentImages[index];
          });
          
          // Preload the rest in the background
          setTimeout(() => {
            this.currentImages.forEach(src => {
              const img = new Image();
              img.src = src;
            });
          }, 1000);
        }
      };
    }
  })();
</script>
